<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat - 智能对话</title>
    <meta name="description" content="优雅的AI智能对话体验">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
</head>
<body>
    <div id="bg-layer"></div>
    <div id="bg-mask"></div>
    <div id="grain-overlay"></div>
    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">✦</span>
                    <span class="logo-text">AI Chat</span>
                </div>
                <button id="new-chat-btn" class="btn-icon" title="新建对话">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>
            <div id="chat-list" class="chat-list"></div>
            <div class="sidebar-footer">
                <button id="sidebar-settings-btn" class="btn-icon" title="设置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
            </div>
        </aside>
        <div id="sidebar-overlay"></div>
        <main id="chat-main">
            <header id="top-bar">
                <button id="menu-btn" class="btn-icon" title="菜单">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div id="chat-title" class="chat-title">新对话</div>
                <div class="top-bar-actions">
                    <button id="summary-btn" class="btn-icon" title="总结对话">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    </button>
                    <button id="fullscreen-btn" class="btn-icon" title="全屏">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                    </button>
                </div>
            </header>
            <div id="messages" class="messages-container">
                <div id="welcome-screen" class="welcome-screen">
                    <div class="welcome-greeting" id="welcome-greeting"></div>
                    <div class="welcome-sub" id="welcome-time"></div>
                    <div class="welcome-hints">
                        <div class="hint-card" data-hint="帮我写一首关于春天的诗">
                            <span class="hint-icon">诗</span>
                            <span>帮我写一首关于春天的诗</span>
                        </div>
                        <div class="hint-card" data-hint="用简单的语言解释什么是量子计算">
                            <span class="hint-icon">理</span>
                            <span>用简单的语言解释量子计算</span>
                        </div>
                        <div class="hint-card" data-hint="推荐几部好看的电影">
                            <span class="hint-icon">影</span>
                            <span>推荐几部好看的电影</span>
                        </div>
                        <div class="hint-card" data-hint="给我讲一个有趣的故事">
                            <span class="hint-icon">故</span>
                            <span>给我讲一个有趣的故事</span>
                        </div>
                    </div>
                </div>
            </div>
            <div id="input-area" class="input-area">
                <div class="input-wrapper">
                    <textarea id="chat-input" placeholder="输入消息..." rows="1"></textarea>
                    <div class="input-actions">
                        <button id="send-btn" class="btn-send" title="发送">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                        <button id="stop-btn" class="btn-stop" title="停止" style="display:none;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
                        </button>
                    </div>
                </div>
                <div class="input-footer">
                    <span class="input-hint">Enter 发送 / Shift+Enter 换行</span>
                </div>
            </div>
        </main>
    </div>
    <div id="settings-overlay" class="settings-overlay"></div>
    <div id="settings-panel" class="settings-panel">
        <div class="settings-header">
            <h3>设置</h3>
            <button id="close-settings" class="btn-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="settings-body">
            <div class="settings-section">
                <div class="section-title">外观</div>
                <div class="setting-item">
                    <label>主题</label>
                    <select id="set-theme">
                        <option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>气泡样式</label>
                    <select id="set-bubble">
                        <option value="modern">现代简约</option><option value="ios">毛玻璃</option><option value="water">水玻璃</option><option value="none">无气泡</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label class="checkbox-label">
                        <input type="checkbox" id="set-timestamp">
                        <span>显示消息时间戳</span>
                    </label>
                </div>
            </div>
            <div class="settings-section">
                <div class="section-title">头像</div>
                <div class="setting-item">
                    <label>用户头像 URL</label>
                    <input type="text" id="set-useravatar" placeholder="https://example.com/avatar.jpg">
                </div>
                <div class="setting-item">
                    <label>AI 头像 URL</label>
                    <input type="text" id="set-aiavatar" placeholder="https://example.com/avatar.jpg">
                </div>
            </div>
            <div class="settings-section">
                <div class="section-title">背景</div>
                <div class="setting-item">
                    <label>背景图片 URL</label>
                    <input type="text" id="set-bgurl" placeholder="图片URL">
                    <input type="file" id="set-bgimage" accept="image/*" class="file-input">
                    <button id="clear-bg" class="btn-small">清除背景</button>
                </div>
                <div class="setting-item">
                    <label>背景模糊 <span id="blur-val">0</span>px</label>
                    <input type="range" id="set-blur" min="0" max="15" step="0.5" value="0">
                </div>
                <div class="setting-item">
                    <label>遮罩透明度 <span id="opacity-val">85</span>%</label>
                    <input type="range" id="set-opacity" min="0.1" max="1" step="0.05" value="0.85">
                </div>
            </div>
            <div class="settings-section">
                <div class="section-title">上下文</div>
                <div class="setting-item">
                    <label>提示阈值 <span class="hint-text">(字符)</span></label>
                    <input type="number" id="set-maxlen" min="500" step="100" value="3000">
                </div>
                <div class="setting-item">
                    <label>保留最近轮数</label>
                    <input type="number" id="set-rounds" min="1" max="20" value="8">
                </div>
                <div id="context-usage" class="context-usage">上下文用量：--</div>
            </div>
            <div class="settings-section">
                <div class="section-title">数据</div>
                <button id="export-btn" class="btn-action btn-secondary">导出对话</button>
                <button id="clear-conv" class="btn-action btn-danger">清空当前对话</button>
                <button id="clear-all" class="btn-action btn-danger">清空所有数据</button>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
